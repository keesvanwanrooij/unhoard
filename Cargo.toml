# Unhoard Rust workspace: the platform-neutral core, the Windows platform layer, the CLI
# and the Tauri app. Shared lints enforce the engineering standards in AGENTS.md.
[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/cli", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
authors = ["Kees van Wanrooij"]
repository = "https://github.com/keesvanwanrooij/unhoard"
publish = false

[workspace.dependencies]
unhoard-core = { path = "crates/core" }
unhoard-platform = { path = "crates/platform" }
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
globset = { version = "0.4.21", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

[profile.bench]
debug = false
