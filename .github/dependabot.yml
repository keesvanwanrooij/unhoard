# Dependabot keeps the pinned GitHub Actions current. The Cargo and npm entries are
# switched on in the MVP build, once Cargo.toml and package.json exist.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

