name: Bug report
description: Something in Unhoard does not work as the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please do not paste real scans, file lists or photos,
        and replace your user folder with `%USERPROFILE%` in any path.
        **Security problems go through private reporting, see SECURITY.md, not here.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan C:
        2. Open Suggestions
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scan
        - Storage map
        - Known locations and suggestions
        - Quarantine and restore
        - Cloud (OneDrive)
        - Photo review
        - Companion
        - Languages
        - CLI
        - Installer
        - Other
    validations:
      required: true
  - type: dropdown
    id: data-safety
    attributes:
      label: Did a file get moved, changed or deleted that should not have been?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Unhoard build
      description: Settings › About shows the build identifier.
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Dutch
