[package]
name = "unhoard-app"
description = "The Unhoard desktop app: Tauri commands and state around the core."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "unhoard_app"
path = "src/lib.rs"

[[bin]]
name = "unhoard-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
unhoard-core.workspace = true
unhoard-platform.workspace = true

[dev-dependencies]
unhoard-core = { workspace = true, features = ["fake"] }

[lints]
workspace = true
