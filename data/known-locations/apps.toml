# Known locations: data and cache folders of popular apps and developer tools. Caches the
# app rebuilds are Safe; downloads the user chose (models, toolchains, mailboxes) are Review
# and point to the app's own way of removing them.

[[rule]]
id = "conda-pkgs-miniconda"
parent = "%USERPROFILE%\\miniconda3"
name = "pkgs"
kind = "dir"
category = "developer"
tier = "likelySafe"
action = "explainOnly"
example = "%USERPROFILE%\\miniconda3\\pkgs"
nearMiss = "%USERPROFILE%\\miniconda3\\envs"

[[rule]]
id = "conda-pkgs-anaconda"
parent = "%USERPROFILE%\\anaconda3"
name = "pkgs"
