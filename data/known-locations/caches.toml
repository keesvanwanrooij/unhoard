# Known locations: caches that apps rebuild by themselves. Close the app first; profile
# data (bookmarks, passwords, history) is never matched.

[[rule]]
id = "chrome-cache"
parent = "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*"
name = "Cache"
kind = "dir"
category = "other"
tier = "safe"
action = "quarantine"
example = "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Cache"
nearMiss = "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Caches"

[[rule]]
id = "chrome-code-cache"
parent = "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*"
name = "Code Cache"
kind = "dir"
category = "other"
tier = "safe"
action = "quarantine"
example = "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Code Cache"
nearMiss = "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Code Caches"

