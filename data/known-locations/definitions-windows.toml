# Definitions: what Windows' own folders are. A definition (define = true) explains an
# item without an opinion about removing it and is never listed as a suggestion; with
# tier = "keep" it also says the item must stay. Every definition has an example that
# must match it and a nearMiss that must not (tested).

[[rule]]
id = "def-windows"
define = true
parent = "?:"
name = "Windows"
kind = "dir"
tier = "keep"
example = "C:\\Windows"
nearMiss = "C:\\x-Windows"

