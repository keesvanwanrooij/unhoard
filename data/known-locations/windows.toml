# Known locations: Windows itself. Parent and name are globs; %VAR% is expanded per PC.
# Every rule has an example that must match it and a nearMiss that must not (tested).

[[rule]]
id = "windows-old"
parent = "?:"
name = "Windows.old"
kind = "dir"
category = "system"
tier = "likelySafe"
action = "windowsTool:diskCleanup"
requiresAdmin = true
docs = ["https://support.microsoft.com/windows/delete-your-previous-version-of-windows-f8b26680-e083-c710-b757-7567d69dbb74"]
example = "C:\\Windows.old"
nearMiss = "C:\\Windows.older"

[[rule]]
id = "hiberfil"
parent = "?:"
name = "hiberfil.sys"
kind = "file"
category = "system"
tier = "keep"
action = "explainOnly"
docs = ["https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/disable-and-re-enable-hibernation"]
example = "C:\\hiberfil.sys"
nearMiss = "C:\\hiberfil.sys.bak"

[[rule]]
id = "pagefile"
parent = "?:"
name = "pagefile.sys"
kind = "file"
category = "system"
tier = "keep"
action = "explainOnly"
example = "C:\\pagefile.sys"
nearMiss = "C:\\pagefile.old"

[[rule]]
id = "swapfile"
parent = "?:"
name = "swapfile.sys"
kind = "file"
category = "system"
tier = "keep"
action = "explainOnly"
example = "C:\\swapfile.sys"
nearMiss = "C:\\swapfile.txt"

[[rule]]
id = "winsxs"
parent = "%WINDIR%"
name = "WinSxS"
kind = "dir"
category = "system"
tier = "keep"
action = "windowsTool:diskCleanup"
requiresAdmin = true
docs = ["https://learn.microsoft.com/windows-hardware/manufacture/desktop/clean-up-the-winsxs-folder"]
example = "%WINDIR%\\WinSxS"
nearMiss = "%WINDIR%\\WinSxS2"

[[rule]]
# Each item in the user's Temp folder on its own, once it is a day old, so a large
# leftover can be cleared without the rest; items still in use are skipped by the move.
id = "user-temp"
parent = "%LOCALAPPDATA%\\Temp"
name = "*"
kind = "any"
minAgeDays = 1
category = "other"
tier = "safe"
action = "quarantine"
example = "%LOCALAPPDATA%\\Temp\\setup.log"
nearMiss = "%LOCALAPPDATA%\\Templates\\setup.log"

[[rule]]
# Diagnostic traces of the Remote Desktop client WSL uses to show Linux apps (WSLg).
id = "wsl-rdclient-traces"
parent = "%LOCALAPPDATA%\\Temp\\DiagOutputDir"
name = "RdClientAutoTrace"
kind = "dir"
category = "other"
tier = "safe"
action = "quarantine"
example = "%LOCALAPPDATA%\\Temp\\DiagOutputDir\\RdClientAutoTrace"
nearMiss = "%LOCALAPPDATA%\\Temp\\DiagOutputDir\\Other"

