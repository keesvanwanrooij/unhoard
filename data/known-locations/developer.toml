# Known locations: developer caches and per-project build folders. Build folders are found
# by a sibling marker, so a folder called "target" is only a Rust build folder next to a
# Cargo.toml. They never match inside app folders, hidden folders in the profile or another
# node_modules: there they are what an installed app or extension runs from.

[[rule]]
id = "npm-cache"
parent = "%LOCALAPPDATA%"
name = "npm-cache"
kind = "dir"
category = "developer"
tier = "safe"
action = "quarantine"
example = "%LOCALAPPDATA%\\npm-cache"
nearMiss = "%LOCALAPPDATA%\\npm-cache2"

[[rule]]
id = "pnpm-store"
parent = "%LOCALAPPDATA%\\pnpm"
name = "store"
kind = "dir"
category = "developer"
tier = "safe"
action = "quarantine"
example = "%LOCALAPPDATA%\\pnpm\\store"
nearMiss = "%LOCALAPPDATA%\\pnpm\\global"

