[[rule]]
id = "node-modules"
parent = "**"
exclude = ["%LOCALAPPDATA%", "%APPDATA%", "%PROGRAMFILES%", "%PROGRAMFILES(X86)%", "%PROGRAMDATA%", "%USERPROFILE%\\.*", "**\\node_modules"]
name = "node_modules"
kind = "dir"
sibling = "package.json"
category = "developer"
tier = "likelySafe"
action = "quarantine"
example = "C:\\code\\app\\node_modules"
nearMiss = "C:\\code\\lib\\node_modules"

